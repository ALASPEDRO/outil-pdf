<style>
  :root { --bg: #f3f4f7; --card: #fff; --ink: #16202a; --muted: #5b6676; --line: #d9dee6; --accent: #2447d6; --bad: #b3261e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1218; --card: #181d26; --ink: #eef1f6; --muted: #a7b0bf; --line: #2c3442; --accent: #6d8cff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px 22px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(10,14,18,.08); }
  img { width: 72px; height: 72px; justify-self: center; border-radius: 18px; }
  h1 { margin: 0; text-align: center; font-size: 24px; letter-spacing: -.01em; }
  p { margin: 0; text-align: center; color: var(--muted); font-size: 14.5px; }
  label { font-weight: 600; font-size: 14px; }
  input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=password]:focus { outline: 2.5px solid var(--accent); outline-offset: 1px; }
  .opt { display: flex; gap: 10px; align-items: center; font-weight: 500; }
  .opt input { width: 20px; height: 20px; accent-color: var(--accent); }
  button { font: inherit; font-weight: 700; font-size: 17px; padding: 13px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--bad); font-weight: 600; min-height: 1.4em; text-align: center; font-size: 14.5px; }
</style>

    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(P.sel), iterations: P.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  var ready = new Promise(function (r) { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", r); else r(); });
  function launch(key) {
    return ready.then(function () { return crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.data)).then(function (plain) {
      var html = new TextDecoder().decode(plain);
      var lock = "<script>window.CAVIARDEUR_LOCK=function(){try{localStorage.removeItem('" + KEY + "')}catch(e){}location.reload()};<\/script>";
      html = html.replace(/<body([^>]*)>/i, function (m) { return m + lock; });
      mount(html);
    }); });
  }
  // Remplace la page par l'application et exécute ses scripts dans l'ordre.
  function mount(html) {
    var d = new DOMParser().parseFromString(html, "text/html"), root = document.documentElement;
    root.replaceChild(document.adoptNode(d.head), document.head);
    root.replaceChild(document.adoptNode(d.body), document.body);
    var list = Array.prototype.slice.call(document.querySelectorAll("script"));
    return list.reduce(function (p, old) {
      return p.then(function () {
        return new Promise(function (res) {
          var s = document.createElement("script");
          for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
          if (old.src) { s.onload = s.onerror = function () { res(); }; } else s.textContent = old.textContent;
          old.parentNode.replaceChild(s, old);
          if (!old.src) res();
        });
      });
    }, Promise.resolve());
  }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.sel === P.sel) {
      document.body.style.visibility = "hidden";
      crypto.subtle.importKey("raw", u8(saved.k), "AES-GCM", false, ["decrypt"]).then(launch).catch(function () {
        try { localStorage.removeItem(KEY); } catch (e) {}
        document.body.style.visibility = "";
      });
    }
  } catch (e) {}
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value, keep = document.getElementById("keep").checked;
    if (!pw) return;
    go.disabled = true; err.textContent = ""; go.textContent = "Ouverture…";
    derive(pw).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.data)).then(function () {
        if (!keep) return key;
        return crypto.subtle.exportKey("raw", key).then(function (raw) { try { localStorage.setItem(KEY, JSON.stringify({ sel: P.sel, k: b64(raw) })); } catch (e) {} return key; });
      });
    }).then(launch).catch(function () {
      go.disabled = false; go.textContent = "Ouvrir";
      err.textContent = "Mot de passe incorrect.";
      document.getElementById("pw").select();
    });
  });
})();
</script>
